<!DOCTYPE html>
<html lang="es" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Organizer">
<meta name="format-detection" content="telephone=no">
<title>Organizer</title>
<style>
:root{
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--pink:#ff2d55;
  --indigo:#5856d6;--teal:#30b0c7;--yellow:#ffcc00;--gray:#8e8e93;
  --bg:#f2f2f7;--bg-2:#ffffff;--bg-3:#e5e5ea;--label:#000;--label-2:rgba(60,60,67,.6);--label-3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.2);--fill:rgba(120,120,128,.12);--bar:rgba(249,249,249,.84);--seg-on:#fff;
  --tint:var(--blue);--tint-soft:color-mix(in srgb,var(--tint) 14%,transparent);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--radius:12px;color-scheme:light
}
html.dark{
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--pink:#ff375f;
  --indigo:#5e5ce6;--teal:#40c8e0;--yellow:#ffd60a;--gray:#98989d;
  --bg:#000;--bg-2:#1c1c1e;--bg-3:#2c2c2e;--label:#fff;--label-2:rgba(235,235,245,.6);--label-3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.32);--bar:rgba(22,22,24,.84);--seg-on:#636366;color-scheme:dark
}
html[data-accent=green]{--tint:var(--green)}html[data-accent=orange]{--tint:var(--orange)}
html[data-accent=purple]{--tint:var(--purple)}html[data-accent=pink]{--tint:var(--pink)}
html[data-accent=indigo]{--tint:var(--indigo)}html[data-accent=teal]{--tint:var(--teal)}html[data-accent=red]{--tint:var(--red)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  letter-spacing:-.022em;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100dvh}
body.sheet-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
a{color:var(--tint);text-decoration:none}
svg{display:block;flex:0 0 auto}
[hidden]{display:none!important}

/* Estructura */
#app{display:flex;min-height:100dvh}
#sidebar{display:none}
#main{flex:1;min-width:0}
#navbar{position:sticky;top:0;z-index:20;padding-top:var(--safe-t);transition:background .2s}
#navbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.nav-inner{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;position:relative;max-width:760px;margin:0 auto}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s;pointer-events:none}
#navbar.scrolled .nav-title{opacity:1}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--tint);min-width:44px;height:44px;padding:0 8px;font-size:17px}
.nav-btn.back{padding-left:2px;justify-content:flex-start}
.nav-btn.strong{font-weight:600}
.nav-btn.ghost{pointer-events:none}
.nav-actions{display:flex;align-items:center}
.tm-pill{background:var(--tint-soft);color:var(--tint);font-size:14px;font-weight:600;padding:5px 11px;border-radius:15px;margin-right:4px;font-variant-numeric:tabular-nums}
#view{max-width:760px;margin:0 auto;padding:0 0 calc(130px + var(--safe-b))}
.page-enter{animation:pageIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.large-title{font-size:34px;font-weight:700;letter-spacing:-.035em;margin:2px 20px 4px;line-height:1.12}
.subtitle{margin:0 20px 16px;color:var(--label-2);font-size:15px}
.large-title+.group,.large-title+.search,.large-title+.chips{margin-top:14px}

/* Barra de pestañas */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px 6px calc(4px + var(--safe-b));background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--label-2);font-size:10px;font-weight:500;min-height:46px;justify-content:center;text-align:center}
#tabbar button.on{color:var(--tint)}
#fab{position:fixed;right:18px;bottom:calc(74px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--tint);color:#fff;display:none;place-items:center;
  box-shadow:0 6px 18px color-mix(in srgb,var(--tint) 40%,transparent),0 2px 6px rgba(0,0,0,.18);z-index:25;transition:transform .15s}
#fab.show{display:grid}#fab:active{transform:scale(.92)}

/* Listas agrupadas */
.group{background:var(--bg-2);border-radius:var(--radius);margin:0 16px 24px;overflow:hidden}
.group-title{font-size:13px;text-transform:uppercase;color:var(--label-2);margin:0 32px 7px;letter-spacing:-.005em}
.group-foot{font-size:13px;color:var(--label-2);margin:-16px 32px 24px;line-height:1.4}
.group-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 32px 7px}
.group-head .group-title{margin:0}
.link{color:var(--tint);font-size:15px;font-weight:500}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;background:var(--bg-2);width:100%}
.row::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.row.lead::after{left:58px}
.group>.row:last-child::after,.group>.swipe:last-child>.row::after,.row.nosep::after{display:none}
button.row{text-align:left}
button.row:active,.row[onclick]:active{background:var(--fill)}
.row label{flex:0 0 auto}
.grow{flex:1;min-width:0}
.row-title{font-size:17px;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--label-2);margin-top:1px;overflow-wrap:anywhere}
.row-val{color:var(--label-2);margin-left:auto;display:flex;align-items:center;gap:6px}
.row.action{color:var(--tint)}
.row.destructive{color:var(--red)}
.chev{color:var(--label-3)}
.lead-ic{color:var(--tint);display:grid;place-items:center;width:26px}
.badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--c,var(--tint));color:#fff;flex:0 0 30px}
.badge.lg{width:40px;height:40px;border-radius:10px;flex-basis:40px}
.late{color:var(--red)}.prio{color:var(--red);font-weight:700}.done{text-decoration:line-through;color:var(--label-2)}.flag{color:var(--orange)}
.muted{color:var(--label-2)}
.icon-x{color:var(--label-3);width:32px;height:32px;display:grid;place-items:center;margin-right:-6px;flex:0 0 32px}
.row input.plain,.row textarea.plain{border:0;outline:0;background:transparent;width:100%;padding:0;min-width:0}
.row textarea.plain{resize:none;min-height:70px;line-height:1.4}
.row select,.row input[type=date],.row input[type=time],.row input[type=number],.row input[type=text].val{margin-left:auto;background:var(--fill);border:0;border-radius:8px;
  padding:6px 10px;min-height:34px;max-width:62%;outline:0;text-align:right;font-size:17px}
.row input[type=number]{width:110px}
.row .seg{margin-left:auto;width:62%}
.row input[type=range]{margin-left:auto;width:55%;accent-color:var(--tint)}
.check{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label-3);flex:0 0 24px;display:grid;place-items:center;position:relative;color:transparent;background:transparent;transition:background .15s}
.check::before{content:"";position:absolute;inset:-10px}
.check.on{background:var(--c,var(--tint));border-color:var(--c,var(--tint));color:#fff}
.check:not(.on){border-color:var(--c,var(--label-3))}
.switch{position:relative;width:51px;height:31px;flex:0 0 51px;margin-left:auto}
.switch input{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);margin:0;position:relative;cursor:pointer;transition:background .25s;outline:0;border:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s}
.switch input:checked{background:var(--green)}.switch input:checked::after{transform:translateX(20px)}

/* Deslizar */
.swipe{position:relative;overflow:hidden;background:var(--bg-2)}
.swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex}
.swipe-actions button{width:76px;color:#fff;font-size:15px;font-weight:600;text-align:center}
.swipe-actions .red{background:var(--red)}.swipe-actions .orange{background:var(--orange)}.swipe-actions .blue{background:var(--blue)}
.swipe-content{position:relative;z-index:1;transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}

/* Controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;text-align:center}
.btn.sm{min-height:34px;padding:0 14px;border-radius:17px;font-size:15px}
.btn.tinted{background:var(--tint-soft);color:var(--tint)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.block{width:100%}.btn:active{opacity:.65}
.btn-row{display:flex;gap:10px;margin:0 16px 24px;flex-wrap:wrap}.btn-row .btn{flex:1;min-width:130px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;min-height:30px;border-radius:7px;font-size:13px;font-weight:500;padding:0 6px;white-space:nowrap;text-align:center}
.seg button.on{background:var(--seg-on);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:34px;padding:0 14px;border-radius:17px;background:var(--bg-2);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--tint);color:#fff}.chip .n{opacity:.55;font-size:13px}
.search{margin:0 16px 16px;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;color:var(--label-2)}
.search input{flex:1;background:transparent;border:0;outline:0;min-height:38px;min-width:0;color:var(--label)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.sw{width:28px;height:28px;border-radius:50%;background:var(--c);position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--c);opacity:.9}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--fill);color:var(--label-2);white-space:nowrap}
.pill.c{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 24px}
.tile{background:var(--bg-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:88px;text-align:left}
.tile:active{opacity:.7}
.tile .t-top{display:flex;justify-content:space-between;align-items:center}
.tile .t-ic{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.tile .t-n{font-size:30px;font-weight:700;line-height:1}
.tile .t-l{font-size:15px;font-weight:600;color:var(--label-2)}
.card{background:var(--bg-2);border-radius:var(--radius);margin:0 16px 24px;padding:16px}
.card h3{margin:0 0 4px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px;letter-spacing:-.03em}.stats span{font-size:12px;color:var(--label-2)}
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;flex:0 0 auto}.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:20px}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}.bar>i{display:block;height:100%;background:var(--c,var(--tint));border-radius:4px;transition:width .3s}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.col i{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--c,var(--tint));min-height:3px}
.col span{font-size:11px;color:var(--label-2)}.col em{font-size:11px;font-style:normal;color:var(--label-2)}
.empty{text-align:center;color:var(--label-2);padding:34px 24px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty strong{color:var(--label);font-size:17px}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em}
.strip{display:flex;gap:6px;margin-top:10px}
.strip .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--label-2)}
.strip .d.t{color:var(--tint);font-weight:700}
.strip .check{width:30px;height:30px;flex-basis:30px}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:14px 16px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--fill)}.heat i.on{background:var(--c)}
.capture .row{gap:10px}

/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 14px 6px 20px}
.cal-head h2{font-size:20px;margin:0;text-transform:capitalize;letter-spacing:-.03em}
.cal-nav{display:flex;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);margin:0 8px 18px}
.cal-dow{text-align:center;font-size:12px;font-weight:600;color:var(--label-2);padding:6px 0}
.day{height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:3px}
.day .dn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.day.dim .dn{color:var(--label-3)}.day.today .dn{color:var(--tint);font-weight:700}
.day.sel .dn{background:var(--tint);color:#fff}.day.sel.today .dn{color:#fff}
.dots{display:flex;gap:3px;height:5px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.ev-bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:0 0 4px;min-height:30px}
.ev-time{font-size:13px;color:var(--label-2);width:64px;flex:0 0 64px}

/* Temporizador */
.timer{position:relative;width:250px;height:250px;margin:6px auto 18px}
.timer svg{position:absolute;inset:0}
.timer .tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .tx b{font-size:56px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.timer .tx span{color:var(--label-2);font-size:14px}

/* Hojas */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fadeIn .25s;transition:opacity .25s}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100dvh - var(--safe-t) - 10px);background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  animation:slideUp .38s cubic-bezier(.32,.72,0,1);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sheet.full{height:calc(100dvh - var(--safe-t) - 10px)}
@keyframes slideUp{from{transform:translateY(100%)}}
.closing .sheet{transform:translateY(100%)!important}.closing .backdrop{opacity:0}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:6px auto 0;flex:0 0 5px}
.sheet-head{display:grid;grid-template-columns:1fr minmax(0,2fr) 1fr;align-items:center;padding:2px 6px;min-height:48px;flex:0 0 auto}
.sheet-head h2{font-size:17px;font-weight:600;margin:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .l{justify-self:start}.sheet-head .r{justify-self:end}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:8px 0 calc(28px + var(--safe-b));-webkit-overflow-scrolling:touch;flex:1}
.preview{width:calc(100% - 32px);margin:0 16px 16px;border-radius:12px;max-height:60dvh;object-fit:contain;background:var(--fill)}
.alert-wrap{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:30px;animation:fadeIn .2s}
.alert{width:min(100%,290px);background:var(--bg-2);border-radius:14px;text-align:center;overflow:hidden}
.alert h3{margin:18px 16px 4px;font-size:17px}.alert p{margin:0 16px 18px;font-size:13px;color:var(--label-2)}
.alert-btns{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.alert-btns button{min-height:46px;font-size:17px;color:var(--tint);text-align:center}
.alert-btns button+button{border-left:.5px solid var(--sep);font-weight:600}.alert-btns .danger{color:var(--red)}
#toast{position:fixed;top:calc(var(--safe-t) + 8px);left:50%;transform:translate(-50%,-140px);background:var(--bg-2);color:var(--label);border-radius:24px;padding:11px 18px;
  box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:400;font-size:15px;font-weight:500;transition:transform .4s cubic-bezier(.2,.9,.3,1);display:flex;gap:14px;align-items:center;max-width:calc(100vw - 28px)}
#toast.show{transform:translate(-50%,0)}#toast button{color:var(--tint);font-weight:600}

/* Escritorio / iPad */
@media(min-width:900px){
  #sidebar{display:flex;flex-direction:column;width:270px;flex:0 0 270px;position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--bg-2);box-shadow:.5px 0 0 var(--sep);padding:22px 12px}
  #tabbar{display:none}#view{padding-bottom:90px}#fab{bottom:30px;right:36px}
  .side-brand{font-size:22px;font-weight:700;letter-spacing:-.03em;padding:4px 10px 14px}
  .side-label{font-size:12px;font-weight:600;color:var(--label-2);margin:16px 10px 5px;text-transform:uppercase}
  .side-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;font-size:15px;font-weight:500}
  .side-item:hover{background:var(--fill)}.side-item.on{background:var(--tint-soft);color:var(--tint)}
  .side-credit{margin-top:auto;padding:18px 10px 0;font-size:11px;color:var(--label-2);line-height:1.5}
}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:14px;max-height:86dvh}.sheet.full{height:86dvh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#printRoot{display:none}
@media print{body>*:not(#printRoot){display:none!important}#printRoot{display:block;color:#000;background:#fff;padding:20px;font-family:-apple-system,Helvetica,Arial,sans-serif}
  #printRoot h1{font-size:24px}#printRoot h2{font-size:17px;margin:18px 0 6px;border-bottom:1px solid #ccc;padding-bottom:4px}#printRoot li{margin:3px 0}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <header id="navbar"></header>
    <main id="view"></main>
  </div>
</div>
<nav id="tabbar" aria-label="Navegación principal"></nav>
<button id="fab" onclick="fabTap()" aria-label="Crear"></button>
<div id="sheets"></div>
<div id="toast" role="status"></div>
<input type="file" id="scanIn" accept="image/*" capture="environment" hidden onchange="scanPicked(this)">
<div id="printRoot"></div>

<script>
"use strict";
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],byId=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);

/* ================= Deslizar para acciones ================= */
let sw=null,swBlock=0;
document.addEventListener("touchstart",e=>{const c=e.target.closest(".swipe-content");$$(".swipe-content.open").forEach(o=>{if(o!==c)closeSwipe(o)});if(!c){sw=null;return}
 const t=e.touches[0];sw={c,w:c.parentElement.querySelector(".swipe-actions").offsetWidth,x:t.clientX,y:t.clientY,dx:0,lock:null,base:c.classList.contains("open")?-c.parentElement.querySelector(".swipe-actions").offsetWidth:0}},{passive:true});
document.addEventListener("touchmove",e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
 if(sw.lock===null){if(Math.abs(dx)>8||Math.abs(dy)>8)sw.lock=Math.abs(dx)>Math.abs(dy)?"x":"y";else return}
 if(sw.lock!=="x")return;sw.dx=dx;sw.c.style.transition="none";sw.c.style.transform=`translateX(${clamp(sw.base+dx,-sw.w-24,0)}px)`},{passive:true});
document.addEventListener("touchend",()=>{if(!sw)return;const s=sw;sw=null;if(s.lock!=="x")return;swBlock=Date.now();s.c.style.transition="";
 if(s.base+s.dx<-s.w/2){s.c.style.transform=`translateX(${-s.w}px)`;s.c.classList.add("open")}else closeSwipe(s.c)});
function closeSwipe(c){c.style.transform="";c.classList.remove("open")}
document.addEventListener("click",e=>{if(Date.now()-swBlock<400){e.stopPropagation();e.preventDefault();return}
 const c=e.target.closest(".swipe-content.open");if(c&&!e.target.closest(".swipe-actions")){e.stopPropagation();e.preventDefault();closeSwipe(c)}},true);

/* ================= Tareas: lógica ================= */
const taskLate=t=>!t.done&&t.date&&t.date<todayK();
function nextRepeat(k,r){const d=pdate(k);if(r==="daily")d.setDate(d.getDate()+1);else if(r==="weekly")d.setDate(d.getDate()+7);else if(r==="monthly")d.setMonth(d.getMonth()+1);else if(r==="weekdays"){do d.setDate(d.getDate()+1);while([0,6].includes(d.getDay()))}return dkey(d)}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.doneAt=t.done?new Date().toISOString():null;
 if(t.done&&t.repeat){const base=t.date&&t.date>todayK()?t.date:todayK(),c=JSON.parse(JSON.stringify(t));c.id=uid();c.done=false;c.doneAt=null;c.date=nextRepeat(base,t.repeat);c.subtasks.forEach(s=>s.done=false);S.tasks.push(c);t.repeat="";toast("Próxima repetición: "+relDate(c.date))}
 commit()}
function flagTask(id){const t=S.tasks.find(x=>x.id===id);if(t){t.flag=!t.flag;commit()}}
function delTask(id){const i=S.tasks.findIndex(t=>t.id===id);if(i<0)return;const [t]=S.tasks.splice(i,1);commit();toast("Tarea eliminada",()=>{S.tasks.splice(i,0,t);commit()})}
function parseQuick(text){
 let title=text.trim(),date="",priority="Media",time="";const t0=todayK();
 [[/\bpasado mañana\b/i,2],[/\bmañana\b/i,1],[/\bhoy\b/i,0]].forEach(([re,n])=>{if(!date&&re.test(title)){date=addDays(t0,n);title=title.replace(re,"")}});
 ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"].forEach((w,i)=>{const re=new RegExp("\\b"+w+"\\b","i");if(!date&&re.test(title)){const d=pdate(t0);d.setDate(d.getDate()+((i-d.getDay()+7)%7||7));date=dkey(d);title=title.replace(re,"")}});
 const tm=title.match(/\b(\d{1,2}):(\d{2})\b/);if(tm&&+tm[1]<24){time=pad(+tm[1])+":"+tm[2];title=title.replace(tm[0],"")}
 if(/!{2,}/.test(title)){priority="Alta";title=title.replace(/!{2,}/g,"")}
 title=title.replace(/\s+/g," ").replace(/\b(para el|para|el|a las)\s*$/i,"").trim();
 return {title:title||text.trim(),date,priority,time}}
function qaSubmit(){const el=byId("qa"),v=el.value.trim();if(!v)return false;if(!S.areas.length){toast("Crea un área primero");return false}
 const p=parseQuick(v);S.tasks.unshift({id:uid(),title:p.title,notes:"",areaId:ui.taskArea!=="all"?ui.taskArea:S.areas[0].id,nodeId:null,priority:p.priority,date:p.date,time:p.time,repeat:"",flag:false,subtasks:[],done:false,created:new Date().toISOString()});
 el.value="";save();paintTasks();paintCounts();toast("Tarea añadida"+(p.date?" · "+relDate(p.date):""));return false}
function taskRow(t,o={}){
 const a=area(t.areaId),n=node(t.nodeId),parts=[],subs=t.subtasks.length?t.subtasks.filter(s=>s.done).length+"/"+t.subtasks.length+" subtareas":"";
 if(t.date)parts.push(`<span class="${taskLate(t)?"late":""}">${esc(relDate(t.date))}${t.time?" "+esc(t.time):""}</span>`);
 if(!o.hideArea){const nm=n?n.name:a?a.name:"";if(nm)parts.push(esc(nm))}
 if(subs)parts.push(subs);if(t.repeat)parts.push("Repite");
 const body=`<div class="row swipe-content" onclick="taskSheet('${t.id}')">${checkBtn(t.done,colorOf(a&&a.color),`toggleTask('${t.id}')`)}<div class="grow"><div class="row-title ${t.done?"done":""}">${t.priority==="Alta"&&!t.done?'<span class="prio">!! </span>':""}${esc(t.title)}</div>${parts.length?`<div class="row-sub">${parts.join(" · ")}</div>`:""}</div>${t.flag?`<span class="flag">${ic("flag",17,2)}</span>`:""}</div>`;
 return swipe(body,[{label:t.flag?"Quitar":"Marcar",cls:"orange",fn:`flagTask('${t.id}')`},{label:"Eliminar",cls:"red",fn:`delTask('${t.id}')`}])}
function taskFilterFn(f){const t0=todayK();return t=>f==="today"?!t.done&&t.date&&t.date<=t0:f==="sched"?!t.done&&t.date:f==="flag"?!t.done&&t.flag:f==="late"?taskLate(t):f==="done"?t.done:!t.done}
function visibleTasks(){const q=ui.taskQ.trim().toLowerCase();let l=S.tasks.filter(taskFilterFn(ui.taskFilter));
 if(ui.taskArea!=="all")l=l.filter(t=>t.areaId===ui.taskArea);if(q)l=l.filter(t=>(t.title+" "+t.notes).toLowerCase().includes(q));return l}
const prioN=p=>p==="Alta"?0:p==="Media"?1:2;
const cmpTask=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.time||"").localeCompare(b.time||"")||prioN(a.priority)-prioN(b.priority);
function dateBucket(t){const t0=todayK();return !t.date?"Sin fecha":t.date<t0?"Vencidas":t.date===t0?"Hoy":t.date===addDays(t0,1)?"Mañana":t.date<=addDays(t0,7)?"Esta semana":"Más adelante"}
function taskBoxHTML(){
 const list=visibleTasks();if(!list.length)return empty("tasks","Todo en orden","No hay tareas en esta vista.");
 let groups=[];
 if(ui.taskFilter==="done")groups=[{t:"",l:list.sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""))}];
 else if(ui.taskGroup==="area"){S.areas.forEach(a=>{const l=list.filter(t=>t.areaId===a.id).sort(cmpTask);if(l.length)groups.push({t:a.name,l})});const r=list.filter(t=>!area(t.areaId));if(r.length)groups.push({t:"Sin área",l:r})}
 else if(ui.taskGroup==="prio")["Alta","Media","Baja"].forEach(p=>{const l=list.filter(t=>t.priority===p).sort(cmpTask);if(l.length)groups.push({t:"Prioridad "+p.toLowerCase(),l})});
 else["Vencidas","Hoy","Mañana","Esta semana","Más adelante","Sin fecha"].forEach(b=>{const l=list.filter(t=>dateBucket(t)===b).sort(cmpTask);if(l.length)groups.push({t:b,l})});
 return groups.map(g=>(g.t?gTitle(g.t):"")+`<div class="group">${g.l.map(t=>taskRow(t,{hideArea:ui.taskGroup==="area"&&ui.taskFilter!=="done"})).join("")}</div>`).join("")}
const paintTasks=()=>{const b=byId("taskBox");if(b)b.innerHTML=taskBoxHTML()};
function taskCounts(){const c={};["open","today","sched","flag","late","done"].forEach(f=>c[f]=S.tasks.filter(taskFilterFn(f)).length);return c}
function paintCounts(){const c=taskCounts();$$(".chip[data-f]").forEach(el=>{const n=$(".n",el);if(n)n.textContent=c[el.dataset.f]})}
const setTF=v=>{ui.taskFilter=v;render()};
const setTG=v=>{ui.taskGroup=v;paintTasks()};
const openTasks=f=>{ui.taskFilter=f;ui.taskQ="";ui.taskArea="all";go("tasks")};

 openSheet({title:ex?"Detalles":"Nueva tarea",left:{label:"Cancelar",fn:"closeSheet()"},right:{label:ex?"Listo":"Añadir",fn:"saveTaskSheet()"},body});
 if(!ex&&!(preset&&preset.title))setTimeout(()=>{const e=byId("f_title");e&&e.focus()},380)}
function saveTaskSheet(){
 const title=byId("f_title").value.trim();if(!title)return toast("Escribe un título");
 Object.assign(TS,{title,notes:byId("f_notes").value,areaId:byId("f_area").value,nodeId:byId("f_node").value||null,date:byId("f_date").value,time:byId("f_time").value,repeat:byId("f_repeat").value,flag:byId("f_flag").checked,priority:byId("f_prio").dataset.value,subtasks:edGet("f_subs")});
 if(TS.repeat&&!TS.date)TS.date=todayK();

 if(TS._inbox){const x=S.inbox.find(q=>q.id===TS._inbox);if(x)x.processed=true;delete TS._inbox}

/* ================= Eventos de calendario ================= */
const gKey=e=>e.start.length===10?e.start:dkey(new Date(e.start));
const gTime=e=>e.start.length===10?"Todo el día":(d=>pad(d.getHours())+":"+pad(d.getMinutes()))(new Date(e.start));
function eventsOn(k){const out=[];
 S.events.filter(e=>e.date===k).forEach(e=>out.push({kind:"event",id:e.id,title:e.title,time:e.allDay?"Todo el día":(e.time||"")+(e.endTime?" – "+e.endTime:""),sort:e.allDay?"00:00":e.time||"00:01",color:e.color||"blue",sub:e.place||""}));
 S.tasks.filter(t=>t.date===k).forEach(t=>out.push({kind:"task",id:t.id,title:t.title,time:t.time||"Tarea",sort:t.time||"23:59",color:(area(t.areaId)||{}).color||"blue",done:t.done,sub:((node(t.nodeId)||area(t.areaId))||{}).name||""}));
 S.countdowns.filter(c=>c.date===k).forEach(c=>out.push({kind:"count",id:c.id,title:c.title,time:"Fecha clave",sort:"00:00",color:"pink",sub:""}));
 S.gcache.filter(e=>gKey(e)===k).forEach(e=>out.push({kind:"google",id:e.id,title:e.title,time:gTime(e),sort:gTime(e)==="Todo el día"?"00:00":gTime(e),color:"red",sub:e.location||"",link:e.htmlLink}));
 return out.sort((a,b)=>a.sort.localeCompare(b.sort))}

function greet(){const h=new Date().getHours();return (h<5?"Buenas noches":h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches")+", "+S.name}
const habitStreak=h=>{let k=todayK(),n=0;if(!h.logs[k])k=addDays(k,-1);while(h.logs[k]){n++;k=addDays(k,-1)}return n};
const habitWeek=h=>{let c=0;for(let i=0;i<7;i++)if(h.logs[addDays(todayK(),-i)])c++;return c};

 actions:()=>`<button class="nav-btn" onclick="go('search')" aria-label="Buscar">${ic("search",23,2)}</button>`,
 render(){

 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dkey(d),ev=eventsOn(k),cols=[...new Set(ev.map(e=>e.color))].slice(0,3);

 const pin=l.filter(n=>n.pinned).sort((a,b)=>b.updated.localeCompare(a.updated));if(pin.length)g.push({t:"Fijadas",l:pin});
 const rest=l.filter(n=>!n.pinned).sort((a,b)=>b.updated.localeCompare(a.updated));
 [["Hoy",1],["Últimos 7 días",7],["Últimos 30 días",30],["Anteriores",1e9]].forEach(([t,d],i,arr)=>{const lo=i?arr[i-1][1]:0;const x=rest.filter(n=>{const age=(now-new Date(n.updated))/864e5;return age>=lo&&age<d&&(i>0||age<1)});if(x.length)g.push({t,l:x})});
 const used=new Set(g.flatMap(x=>x.l.map(n=>n.id)));const left=rest.filter(n=>!used.has(n.id));if(left.length)g.push({t:"Otras",l:left});

  [{label:n.pinned?"Soltar":"Fijar",cls:"orange",fn:`pinNote('${n.id}')`},{label:"Eliminar",cls:"red",fn:`delNote('${n.id}')`}])}

function notesHTML(){const g=noteGroups();return g.length?g.map(x=>gTitle(x.t)+`<div class="group">${x.l.map(noteRow).join("")}</div>`).join("")+`<div class="group-foot" style="margin-top:-8px;text-align:center">${S.memos.length} nota${S.memos.length===1?"":"s"}</div>`:empty("notes",ui.noteQ?"Sin resultados":"Sin notas","Crea tu primera nota con el botón +.")}

function delNote(id){const i=S.memos.findIndex(x=>x.id===id);if(i<0)return;const [n]=S.memos.splice(i,1);commit();toast("Nota eliminada",()=>{S.memos.splice(i,0,n);commit()})}
function noteEditor(id){
 let n=id?S.memos.find(x=>x.id===id):null,isNew=false;if(!n){n={id:uid(),title:"",body:"",pinned:false,areaId:"",updated:new Date().toISOString()};S.memos.unshift(n);isNew=true}NE=n;
 const body=`<div class="group"><div class="row"><input class="plain" id="f_title" style="font-size:22px;font-weight:700" placeholder="Título" value="${esc(n.title)}" oninput="neChange()"></div>
 <div class="row"><textarea class="plain" id="f_body" style="min-height:42dvh" placeholder="Escribe aquí…" oninput="neChange()" onkeydown="neKey(event)">${esc(n.body)}</textarea></div></div>
 <div class="btn-row" style="margin-bottom:14px"><button class="btn sm tinted" onclick="neIns('- ')">Lista</button><button class="btn sm tinted" onclick="neIns('- [ ] ')">Casilla</button><button class="btn sm tinted" onclick="neIns(fmtLong(todayK())+'\\n')">Fecha</button></div>
 <div class="group">${fRow("Área",fSel("f_area",areaOpts("Sin área"),n.areaId,`onchange="NE.areaId=this.value;neChange()"`))}${fRow("Fijada",fSwitch("f_pin",n.pinned,`onchange="NE.pinned=this.checked;neChange()"`))}
 <button class="row action lead" onclick="neShare()"><span class="lead-ic">${ic("share")}</span>Compartir</button><button class="row destructive" onclick="askConfirm('Eliminar nota','Esta acción no se puede deshacer.','Eliminar',()=>{const id=NE.id;NE=null;closeSheet();S.memos=S.memos.filter(x=>x.id!==id);commit()})">Eliminar nota</button></div>
 <div class="group-foot" id="neCount" style="margin-top:-8px"></div>`;
 openSheet({title:"Nota",full:true,left:null,right:{label:"Listo",fn:"closeSheet()"},body,onclose:()=>{if(NE&&!NE.title.trim()&&!NE.body.trim())S.memos=S.memos.filter(x=>x.id!==NE.id);NE=null;commit()}});
 neCount();if(isNew)setTimeout(()=>{const e=byId("f_title");e&&e.focus()},380)}
function neChange(){if(!NE)return;NE.title=byId("f_title").value;NE.body=byId("f_body").value;NE.updated=new Date().toISOString();neCount();clearTimeout(neT);neT=setTimeout(()=>save(),300)}

 if(line.trim()===m[2].trim()){t.value=t.value.slice(0,pos-line.length)+t.value.slice(pos);t.selectionStart=t.selectionEnd=pos-line.length}
 else{const p="\n"+m[1]+(m[2].startsWith("- [")?"- [ ] ":"- ");t.value=t.value.slice(0,pos)+p+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=pos+p.length}neChange()}

const TM={dur:25*60,left:25*60,end:0,running:false,iv:null,wl:null};
const fmtClock=s=>pad(Math.floor(s/60))+":"+pad(s%60);
function tmTick(){if(!TM.running)return;TM.left=Math.max(0,Math.round((TM.end-Date.now())/1000));tmPaint();if(TM.left<=0)tmDone()}
function tmPaint(){const t=byId("tmText");if(t)t.textContent=fmtClock(TM.left);const a=byId("tmArc");if(a){const c=+a.getAttribute("stroke-dasharray");a.setAttribute("stroke-dashoffset",c*(1-TM.left/TM.dur))}const p=byId("tmPill");if(p)p.textContent=fmtClock(TM.left)}
async function tmToggle(){
 if(TM.running){TM.running=false;clearInterval(TM.iv);TM.left=Math.max(0,Math.round((TM.end-Date.now())/1000));try{TM.wl&&TM.wl.release()}catch(e){}}
 else{if(TM.left<=0)TM.left=TM.dur;TM.running=true;TM.end=Date.now()+TM.left*1000;TM.iv=setInterval(tmTick,500);try{TM.wl=await navigator.wakeLock.request("screen")}catch(e){}}
 render()}
function tmReset(){TM.running=false;clearInterval(TM.iv);TM.left=TM.dur;try{TM.wl&&TM.wl.release()}catch(e){}render()}
function tmSet(v){TM.running=false;clearInterval(TM.iv);TM.dur=TM.left=+v*60;render()}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.8);o.start();o.stop(a.currentTime+.8)}catch(e){}}
function tmDone(){clearInterval(TM.iv);TM.running=false;const m=Math.round(TM.dur/60);S.sessions++;S.minutes+=m;S.focusLog.push({id:uid(),date:todayK(),min:m,nodeId:ui.focusNode||null,areaId:ui.focusArea||null});TM.left=TM.dur;beep();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}toast("Sesión completada: "+m+" min");commit()}
let fnT=null;
function focusNote(v){const ref=ui.focusNode||ui.focusArea;if(!ref)return;let n=S.notes.find(x=>x.refId===ref);if(n)n.content=v;else S.notes.push({id:uid(),refId:ref,content:v});clearTimeout(fnT);fnT=setTimeout(save,400)}

function gradeStats(nid){const g=S.grades.filter(x=>x.nodeId===nid&&x.score!==""&&x.score!=null),w=sum(g,x=>+x.weight||0),s=sum(g,x=>(+x.score||0)*(+x.weight||0));const avg=w?s/w:null,rem=Math.max(0,100-w);
 let need=null;if(rem>0){const max=+S.settings.scale,pass=+S.settings.pass;need=(pass*100-s)/rem;if(need<0)need=0;need={v:need,ok:need<=max}}return{avg,w,rem,need}}

reg("stats",{title:"Estadísticas",
 render(){const total=S.tasks.length,done=S.tasks.filter(t=>t.done).length,days=[...Array(7)].map((_,i)=>addDays(todayK(),i-6)),lab=days.map(d=>"DLMMJVS"[pdate(d).getDay()]);
  const td=days.map(k=>S.tasks.filter(t=>t.done&&t.doneAt&&dkey(new Date(t.doneAt))===k).length),fo=days.map(k=>sum(S.focusLog.filter(f=>f.date===k),f=>f.min)),hb=days.map(k=>S.habits.length?Math.round(S.habits.filter(h=>h.logs[k]).length/S.habits.length*100):0);
  const m=todayK().slice(0,7),exp=sum(S.tx.filter(x=>x.date.startsWith(m)&&x.type==="gasto"),x=>x.amount);
  return head("Estadísticas","Observa tu progreso, no la perfección")+`<div class="card"><div class="stats"><div><b>${total}</b><span>Tareas creadas</span></div><div><b>${done}</b><span>Completadas</span></div><div><b>${total?Math.round(done/total*100):0}%</b><span>Finalización</span></div></div></div>`+
  `<div class="card"><h3>Tareas completadas · 7 días</h3>${cols(td,lab,"var(--tint)")}</div><div class="card"><h3>Minutos de enfoque · 7 días</h3>${cols(fo,lab,"var(--orange)")}</div><div class="card"><h3>Constancia de hábitos · 7 días</h3>${cols(hb,lab,"var(--green)",v=>v+"%")}</div>`+
  gTitle("Carga por área")+`<div class="group">${S.areas.map(a=>{const all=S.tasks.filter(t=>t.areaId===a.id),d=all.filter(t=>t.done).length;return `<div class="row nosep" style="flex-direction:column;align-items:stretch;gap:6px"><div style="display:flex;justify-content:space-between"><span>${esc(a.name)}</span><span class="muted">${d}/${all.length}</span></div><div class="bar" style="--c:${colorOf(a.color)}"><i style="width:${all.length?d/all.length*100:0}%"></i></div></div>`}).join("")||`<div class="row muted">Sin áreas</div>`}</div>`+
  `<div class="card"><div class="stats"><div><b>${S.sessions}</b><span>Sesiones de enfoque</span></div><div><b>${S.habits.reduce((m,h)=>Math.max(m,habitStreak(h)),0)}</b><span>Mejor racha actual</span></div><div><b>${money(exp)}</b><span>Gasto del mes</span></div></div></div>`}});

/* ================= Búsqueda ================= */
function searchHTML(){const q=ui.searchQ.trim().toLowerCase();if(!q)return empty("search","Buscar en Organizer","Tareas, notas, áreas, listas, objetivos y más.");
 const m=s=>String(s||"").toLowerCase().includes(q),sec=(t,rows)=>rows.length?gTitle(t)+`<div class="group">${rows.join("")}</div>`:"";
 const r=(t,sub,fn,i)=>`<button class="row lead" onclick="${fn}"><span class="lead-ic">${ic(i,20,1.8)}</span><span class="grow"><span class="row-title">${esc(t)}</span>${sub?`<div class="row-sub">${esc(sub)}</div>`:""}</span></button>`;
 const out=sec("Tareas",S.tasks.filter(t=>m(t.title)||m(t.notes)).slice(0,8).map(t=>r(t.title,t.date?relDate(t.date):"",`taskSheet('${t.id}')`,"tasks")))+
 sec("Notas",S.memos.filter(n=>m(n.title)||m(n.body)).slice(0,8).map(n=>r(n.title||"Sin título",(n.body||"").slice(0,60),`noteEditor('${n.id}')`,"notes")))+
 sec("Áreas y materias",[...S.areas.filter(a=>m(a.name)).map(a=>r(a.name,"Área",`go('area/${a.id}')`,"folder")),...S.nodes.filter(n=>m(n.name)).map(n=>r(n.name,n.type,`go('node/${n.id}')`,"list"))])+
 sec("Listas",S.lists.filter(l=>m(l.name)||l.items.some(i=>m(i.t))).map(l=>r(l.name,"",`go('list/${l.id}')`,"list")))+
 sec("Objetivos",S.goals.filter(g=>m(g.title)).map(g=>r(g.title,goalPct(g)+"%",`goalSheet('${g.id}')`,"target")))+
 sec("Bandeja",S.inbox.filter(x=>m(x.text)).map(x=>r(x.text,"",`go('inbox')`,"inbox")))+
 sec("Eventos",S.events.filter(e=>m(e.title)).map(e=>r(e.title,fmtShort(e.date),`eventSheet('${e.id}')`,"calendar")))+
 sec("Diario",S.journal.filter(e=>m(e.body)||m(e.win)).map(e=>r(fmtLong(e.date),(e.body||"").slice(0,60),`journalSheet('${e.date}')`,"book")))+
 sec("Archivos",FILES.filter(f=>m(f.name)).map(f=>r(f.name,fmtSize(f.size),`previewFile('${f.id}')`,"file")));
 return out||empty("search","Sin resultados","Prueba con otra palabra.")}
reg("search",{tab:"today",back:{label:"Hoy",route:"today"},title:"Buscar",
 render(){return head("Buscar")+`<div class="search">${ic("search",16,2)}<input id="sq" type="search" placeholder="Buscar en todo" value="${esc(ui.searchQ)}" oninput="ui.searchQ=this.value;byId('searchBox').innerHTML=searchHTML()"></div><div id="searchBox">${searchHTML()}</div>`},
 after(){const e=byId("sq");if(e&&!ui.searchQ&&matchMedia("(pointer:fine)").matches)e.focus()}});

/* ================= Integraciones y datos ================= */
let gToken=null,gClient=null,classroomItems=[];
const GSCOPES="https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/classroom.courses.readonly https://www.googleapis.com/auth/classroom.coursework.students.readonly";
const loadGIS=()=>new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
async function connectGoogle(){const id=(byId("gcid")||{}).value?byId("gcid").value.trim():S.settings.googleClient;if(!id)return toast("Introduce tu Client ID de Google");S.settings.googleClient=id;save();
 try{await loadGIS();gClient=google.accounts.oauth2.initTokenClient({client_id:id,scope:GSCOPES,callback:async r=>{if(r.error)return toast("Google no autorizó el acceso");gToken=r.access_token;toast("Google conectado");render();await loadGoogleCalendar(true);await loadClassroom(true)}});gClient.requestAccessToken({prompt:"consent"})}catch(e){toast("No se pudo cargar Google. Abre la app desde una URL https.")}}
function disconnectGoogle(){gToken=null;classroomItems=[];S.gcache=[];commit();toast("Google desconectado")}
async function gFetch(u){if(!gToken)throw new Error("sin token");const r=await fetch(u,{headers:{Authorization:"Bearer "+gToken}});if(!r.ok)throw new Error("Google "+r.status);return r.json()}
async function loadGoogleCalendar(silent){if(!gToken)return toast("Primero conecta Google");try{const a=new Date();a.setDate(a.getDate()-7);const b=new Date();b.setDate(b.getDate()+90);
 const r=await gFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?maxResults=250&singleEvents=true&orderBy=startTime&timeMin="+encodeURIComponent(a.toISOString())+"&timeMax="+encodeURIComponent(b.toISOString()));
 S.gcache=(r.items||[]).filter(e=>e.start).map(e=>({id:e.id,title:e.summary||"Evento",start:e.start.dateTime||e.start.date,end:(e.end||{}).dateTime||(e.end||{}).date,location:e.location||"",htmlLink:e.htmlLink||""}));commit();if(!silent)toast(S.gcache.length+" eventos sincronizados")}catch(e){toast("No se pudo sincronizar Calendar")}}
async function loadClassroom(silent){if(!gToken)return toast("Primero conecta Google");try{const cs=(await gFetch("https://classroom.googleapis.com/v1/courses?courseStates=ACTIVE&pageSize=100")).courses||[];classroomItems=[];
 for(const c of cs){try{((await gFetch("https://classroom.googleapis.com/v1/courses/"+c.id+"/courseWork?pageSize=100")).courseWork||[]).forEach(w=>classroomItems.push({id:c.id+"_"+w.id,courseName:c.name,title:w.title||"Actividad",description:w.description||"",dueDate:w.dueDate,link:w.alternateLink||"",points:w.maxPoints}))}catch(e){}}
 render();if(!silent)toast(classroomItems.length+" actividades")}catch(e){toast("No se pudo leer Classroom")}}
const cDue=x=>x.dueDate?x.dueDate.year+"-"+pad(x.dueDate.month)+"-"+pad(x.dueDate.day):"";
function classTask(x){const nd=S.nodes.find(n=>n.name.toLowerCase()===x.courseName.toLowerCase());return{title:x.title,notes:(x.description||"").slice(0,400)+(x.link?"\n"+x.link:""),date:cDue(x),priority:"Alta",areaId:nd?nd.areaId:(S.areas[0]||{}).id,nodeId:nd?nd.id:null,src:"gc:"+x.id}}
function importClass(i){const x=classroomItems[i];if(!x)return;if(S.tasks.some(t=>t.src==="gc:"+x.id))return toast("Esa actividad ya fue importada");taskSheet(null,classTask(x))}
function importAllClass(){let n=0;classroomItems.forEach(x=>{if(S.tasks.some(t=>t.src==="gc:"+x.id))return;const p=classTask(x);S.tasks.push({id:uid(),subtasks:[],flag:false,repeat:"",time:"",done:false,created:new Date().toISOString(),...p});n++});commit();toast(n+" tareas importadas")}
function dlText(data,name,type){const b=new Blob([data],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\r?\n/g,"\\n");
function exportICS(){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Organizer//ES","CALSCALE:GREGORIAN"],stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
 const ev=(id,t,date,time,end,desc)=>{L.push("BEGIN:VEVENT","UID:"+id+"@organizer","DTSTAMP:"+stamp);if(time){L.push("DTSTART:"+date.replace(/-/g,"")+"T"+time.replace(":","")+"00");L.push(end?"DTEND:"+date.replace(/-/g,"")+"T"+end.replace(":","")+"00":"DURATION:PT1H")}else{L.push("DTSTART;VALUE=DATE:"+date.replace(/-/g,""));L.push("DTEND;VALUE=DATE:"+addDays(date,1).replace(/-/g,""))}L.push("SUMMARY:"+icsEsc(t));if(desc)L.push("DESCRIPTION:"+icsEsc(desc));L.push("END:VEVENT")};
 S.events.forEach(e=>ev(e.id,e.title,e.date,e.allDay?"":e.time,e.allDay?"":e.endTime,e.notes));S.tasks.filter(t=>t.date&&!t.done).forEach(t=>ev(t.id,"Entrega: "+t.title,t.date,t.time,"",t.notes));S.countdowns.forEach(c=>ev(c.id,c.title,c.date,"","",""));L.push("END:VCALENDAR");dlText(L.join("\r\n"),"organizer-agenda.ics","text/calendar")}
function csvDl(name,rows){dlText("\ufeff"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),name,"text/csv")}
const exportTasksCSV=()=>csvDl("organizer-tareas.csv",[["Título","Área","Materia","Fecha","Hora","Prioridad","Completada","Notas"],...S.tasks.map(t=>[t.title,(area(t.areaId)||{}).name,(node(t.nodeId)||{}).name,t.date,t.time,t.priority,t.done?"Sí":"No",t.notes])]);
const exportFinanceCSV=()=>csvDl("organizer-finanzas.csv",[["Fecha","Tipo","Categoría","Monto","Descripción"],...S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.type,x.cat,x.amount,x.note])]);
function exportBackup(){dlText(JSON.stringify(S,null,2),"organizer-respaldo-"+todayK()+".json","application/json")}
function importBackup(inp){const f=inp.files[0];inp.value="";if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.areas||!d.tasks)throw 0;askConfirm("Importar respaldo","Reemplazará los datos actuales (no los archivos).","Importar",async()=>{S=normalize(d);await persist();applyTheme();render();toast("Datos importados")},false)}catch(e){toast("El archivo no es un respaldo válido")}};r.readAsText(f)}
function printOrganizer(){const li=(t)=>`<li>${t.done?"&#10003;":"&#9744;"} ${esc(t.title)}${t.date?" — "+esc(t.date):""}</li>`;
 byId("printRoot").innerHTML=`<h1>Organizer — ${esc(S.name)}</h1><p>Exportado el ${esc(new Date().toLocaleString("es-MX"))}</p>`+S.areas.map(a=>`<h2>${esc(a.name)}</h2><ul>${S.tasks.filter(t=>t.areaId===a.id&&!t.nodeId).map(li).join("")}${S.nodes.filter(n=>n.areaId===a.id).map(n=>`<li><b>${esc(n.name)}</b><ul>${S.tasks.filter(t=>t.nodeId===n.id).map(li).join("")}</ul></li>`).join("")}</ul>`).join("")+
 (S.goals.length?`<h2>Objetivos</h2><ul>${S.goals.map(g=>`<li>${esc(g.title)} — ${goalPct(g)}%</li>`).join("")}</ul>`:"");
 setTimeout(()=>window.print(),100)}
reg("integrations",{title:"Integraciones y datos",
 render(){const ok=!!gToken;
  return head("Integraciones y datos")+
  gTitle("Google Workspace")+`<div class="group">${fRow("Estado",`<span class="pill ${ok?"c":""}" style="--c:var(--green)">${ok?"Conectado":"Sin conectar"}</span>`)}<div class="row"><input class="plain" id="gcid" placeholder="Client ID de OAuth (…apps.googleusercontent.com)" value="${esc(S.settings.googleClient||"")}" autocapitalize="off" autocorrect="off"></div>
  <button class="row action" onclick="connectGoogle()">Conectar con Google</button>${ok?`<button class="row action" onclick="loadGoogleCalendar()">Sincronizar Calendar</button><button class="row action" onclick="loadClassroom()">Cargar actividades de Classroom</button><button class="row destructive" onclick="disconnectGoogle()">Desconectar</button>`:""}</div>
  <div class="group-foot">Requiere un Client ID de tipo Web con Calendar API y Classroom API habilitadas, y que esta página se abra desde una URL https. El acceso es de solo lectura y el token vive solo en esta sesión.</div>`+
  (classroomItems.length?gHead("Actividades de Classroom",`<button class="link" onclick="importAllClass()">Importar todas</button>`)+`<div class="group">${classroomItems.map((x,i)=>`<button class="row" onclick="importClass(${i})"><span class="grow"><span class="row-title">${esc(x.title)}</span><div class="row-sub">${esc(x.courseName)} · ${esc(cDue(x)||"Sin fecha")}</div></span>${S.tasks.some(t=>t.src==="gc:"+x.id)?'<span class="pill">Importada</span>':`<span class="link">Importar</span>`}</button>`).join("")}</div>`:"")+
  gTitle("Exportar")+`<div class="group"><button class="row action lead" onclick="exportICS()"><span class="lead-ic">${ic("calendar")}</span>Agenda (.ics)</button><button class="row action lead" onclick="exportTasksCSV()"><span class="lead-ic">${ic("tasks")}</span>Tareas (CSV)</button><button class="row action lead" onclick="exportFinanceCSV()"><span class="lead-ic">${ic("wallet")}</span>Finanzas (CSV)</button><button class="row action lead" onclick="printOrganizer()"><span class="lead-ic">${ic("file")}</span>Resumen en PDF</button></div>
  <div class="group-foot">El PDF usa el cuadro de impresión de iOS: elige «Guardar en Archivos» o comparte desde la vista previa.</div>`+
  gTitle("Respaldo")+`<div class="group"><button class="row action lead" onclick="exportBackup()"><span class="lead-ic">${ic("download")}</span>Exportar respaldo (JSON)</button><label class="row action lead" style="cursor:pointer"><span class="lead-ic">${ic("plus")}</span>Importar respaldo<input type="file" accept=".json,application/json" hidden onchange="importBackup(this)"></label></div>
  <div class="group-foot">Los archivos de la biblioteca se guardan solo en este navegador y no se incluyen en el respaldo.</div>`}});

/* ================= Ajustes ================= */
function setSet(k,v){S.settings[k]=v;applyTheme();save()}
function setAccent(c){S.settings.accent=c;applyTheme();commit()}
reg("settings",{title:"Ajustes",
 render(){const s=S.settings;
  return head("Ajustes")+`<div class="group">${fRow("Nombre",`<input type="text" class="val" value="${esc(S.name)}" onchange="S.name=this.value.trim()||'Juan Pablo';save()" autocomplete="name">`)}</div>`+
  gTitle("Apariencia")+`<div class="group">${fRow("Tema",segH("st",[{v:"auto",l:"Auto"},{v:"light",l:"Claro"},{v:"dark",l:"Oscuro"}],s.theme,"setTheme"))}<div class="row"><label>Color de acento</label><div class="swatches">${COLORS.map(c=>`<button class="sw ${c===s.accent?"on":""}" style="--c:var(--${c})" onclick="setAccent('${c}')" aria-label="${c}"></button>`).join("")}</div></div></div>`+
  gTitle("Preferencias")+`<div class="group">${fRow("Semana inicia",segH("sw",[{v:1,l:"Lunes"},{v:0,l:"Domingo"}],s.weekStart,"setWeek"))}${fRow("Escala de notas",segH("ss",[{v:10,l:"0–10"},{v:100,l:"0–100"}],s.scale,"setScale"))}
  ${fRow("Nota aprobatoria",`<input type="number" inputmode="decimal" value="${s.pass}" onchange="setSet('pass',+this.value||6)">`)}${fRow("Presupuesto mensual",`<input type="number" inputmode="decimal" value="${s.budget||""}" placeholder="0" onchange="setSet('budget',+this.value||0)">`)}
  ${fRow("Meta de agua (vasos)",`<input type="number" inputmode="numeric" value="${s.waterGoal}" onchange="setSet('waterGoal',+this.value||8)">`)}${fRow("Meta de enfoque (min/día)",`<input type="number" inputmode="numeric" value="${s.focusGoal}" onchange="setSet('focusGoal',+this.value||120)">`)}</div>`+
  gTitle("Datos")+`<div class="group"><button class="row action lead" onclick="go('integrations')"><span class="lead-ic">${ic("plug")}</span><span class="grow">Integraciones, exportar y respaldo</span><span class="chev">${ic("chevR",18,2.4)}</span></button><button class="row destructive" onclick="askConfirm('Borrar todos los datos','Se eliminarán tareas, notas, archivos y ajustes de este dispositivo.','Borrar todo',resetAll)">Borrar todos los datos</button></div>`+
  `<div class="group-foot" style="text-align:center;margin-top:0">Organizer · Diseñado y desarrollado por<br><b>Juan Pablo Bernal Saldaña</b></div>`}});
const setTheme=v=>{S.settings.theme=v;applyTheme();save()},setWeek=v=>{S.settings.weekStart=+v;save()},setScale=v=>{S.settings.scale=+v;save()};
async function resetAll(){await dbClear("state");await dbClear("files");location.hash="#/today";location.reload()}

/* ================= Inicio ================= */
async function boot(){
 makeIcon();
 try{await openDB();const saved=await dbGet("state","main");S=normalize(saved||null);if(!saved)await dbPut("state",{id:"main",...S});await refreshFiles()}
 catch(e){console.error(e);S=normalize(null);toast("El almacenamiento local no está disponible")}
 applyTheme();cur=parseHash();if(!PAGES[cur.page])cur={page:"today",arg:null};render(true);
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
boot();
</script>
</body>
